<body>
  <!--
    このテンプレートはサイトのnewsフォルダー内で使用します。
    1. 複製して news-YYYYMMDD.html に変更（例：news-20261015.html）。
    2. 【 】内の文章、公開日、datetime属性を変更。
    3. 必要に応じてイベント情報・画像・申し込みリンクのコメントを外して編集。
    4. 公開時は ../news.html の一覧にも記事へのリンクを追加。

  <header class="site-header">
    <a href="../index.html" class="site-logo">
      <img src="../images/logo.png" alt="団体ロゴ">

  <main>
    <article class="section">
      <div class="section-inner">
        <p class="news-category">【お知らせ・イベントなど】</p>
        <!-- datetimeはYYYY-MM-DD、表示日はYYYY.MM.DDに変更してください。 -->
        <time datetime="2026-10-15">2026.10.15</time>
        <h1>【ニュースのタイトル】</h1>

        <p>【お知らせの概要を入力してください。】</p>
        <p>【詳しい内容や補足情報を入力してください。不要な場合は削除できます。】</p>

        <!-- イベント告知の場合は、以下のコメントを外して編集してください。
        <p>
          日時：【開催日・曜日・時間】<br>
          場所：【会場名・アクセス】<br>
          対象：【対象となる方】<br>
          参加費：【金額・無料など】
        </p>
        <p>
          イベント内容：<br>
          【プログラム名・内容】<br>
          【プログラム名・内容】
        </p>
        <p>
          【申し込み方法・締切など】<br>
          <a href="【申し込みフォームのURL】">申し込みはこちらから</a>
        </p>
        <p>皆さまのご参加を心よりお待ちしております！</p>
        -->

        <!-- 画像がある場合は、パスと代替テキストを変更してください。
        <img src="../images/【画像ファイル名】" alt="【画像の内容を説明】">
        -->

        <a href="../news.html" class="text-link">ニュース一覧に戻る</a>
      </div>
    </article>
